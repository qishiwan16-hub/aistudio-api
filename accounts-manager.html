<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Accounts — AI Studio Proxy</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--fg:#111;--fg2:#555;--fg3:#999;--border:#e0e0e0;--card:#fff;--accent:#111;--accent-fg:#fff;--danger:#c00;--success:#2a7;--tag:#f0f0f0;--radius:2px;--font:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Hiragino Sans GB',sans-serif;--mono:'SF Mono',Monaco,Consolas,'Liberation Mono',monospace}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ── Header ── */
.header{border-bottom:1px solid var(--border);padding:20px 24px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:15px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.header .sub{font-size:11px;color:var(--fg3);letter-spacing:1px}
.header .actions{display:flex;gap:8px;align-items:center}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;font-size:12px;font-family:var(--font);font-weight:500;letter-spacing:.5px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;transition:all .15s;border-radius:var(--radius)}
.btn:hover{border-color:var(--fg);background:var(--fg);color:var(--accent-fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{opacity:.85}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Stats Bar ── */
.stats-bar{display:flex;gap:32px;padding:16px 24px;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg2);letter-spacing:.5px;flex-wrap:wrap}
.stats-bar .stat{display:flex;flex-direction:column;gap:2px}
.stats-bar .stat .val{font-size:22px;font-weight:300;color:var(--fg);letter-spacing:-1px}
.stats-bar .stat .label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--fg3)}

/* ── Content ── */
.content{padding:24px}

/* ── Account Card ── */
.account-list{display:flex;flex-direction:column;gap:1px;background:var(--border)}
.account-card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 20px;background:var(--card);align-items:center;transition:background .1s}
.account-card:hover{background:#f7f7f7}
.account-card.active{border-left:3px solid var(--accent);padding-left:17px}
.account-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.account-name{font-size:13px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg3);letter-spacing:.3px}
.account-meta .tag{background:var(--tag);padding:1px 6px;border-radius:1px;font-family:var(--mono);font-size:10px;color:var(--fg2)}
.account-actions{display:flex;gap:6px;flex-shrink:0}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:all .2s}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:var(--card);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;border-radius:var(--radius)}
.modal-header{padding:20px 24px 12px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.modal-body{padding:20px 24px}
.modal-footer{padding:12px 24px 20px;display:flex;gap:8px;justify-content:flex-end}

/* ── Form ── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--fg3);margin-bottom:6px;font-weight:500}
.form-group textarea,.form-group input[type=text]{width:100%;padding:10px 12px;font-size:12px;font-family:var(--mono);border:1px solid var(--border);background:var(--bg);color:var(--fg);resize:vertical;border-radius:var(--radius);transition:border .15s}
.form-group textarea:focus,.form-group input[type=text]:focus{outline:none;border-color:var(--fg)}
.form-group textarea{min-height:120px}
.form-group .hint{font-size:10px;color:var(--fg3);margin-top:4px;letter-spacing:.3px}

/* ── Toast ── */
.toast{position:fixed;top:20px;right:20px;z-index:2000;padding:10px 18px;font-size:12px;letter-spacing:.3px;border-left:3px solid var(--accent);background:var(--card);box-shadow:0 2px 12px rgba(0,0,0,.1);transform:translateX(120%);transition:transform .25s;border-radius:var(--radius)}
.toast.show{transform:translateX(0)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.success{border-color:var(--success);color:var(--success)}

/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:var(--fg3)}
.empty .icon{font-size:36px;margin-bottom:12px;opacity:.3}
.empty p{font-size:12px;letter-spacing:1px;text-transform:uppercase}

/* ── Loading ── */
.loading{display:flex;justify-content:center;padding:40px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--fg);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Responsive ── */
@media(max-width:600px){
  .header{padding:16px}
  .stats-bar{padding:12px 16px;gap:20px}
  .content{padding:16px}
  .account-card{padding:12px 16px}
  .account-actions{flex-direction:column}
  .modal{max-width:100%}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Accounts</h1>
    <span class="sub">AI Studio Proxy · Account Manager</span>
  </div>
  <div class="actions">
    <button class="btn" onclick="refreshAll()" id="refreshBtn">↻ Refresh</button>
    <button class="btn primary" onclick="openImportModal()">+ Import</button>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><span class="val" id="statTotal">—</span><span class="label">Accounts</span></div>
  <div class="stat"><span class="val" id="statGroups">—</span><span class="label">Cookie Groups</span></div>
  <div class="stat"><span class="val" id="statActive">—</span><span class="label">Active</span></div>
</div>

<div class="content">
  <div id="listContainer"><div class="loading"><div class="spinner"></div></div></div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <div class="modal-header"><h2>Import Cookies</h2></div>
    <div class="modal-body">
      <div class="form-group">
        <label>Cookie String</label>
        <textarea id="cookieInput" placeholder="Paste cookie string here (JSON array, Netscape, or Key=Value format)"></textarea>
        <div class="hint">Supports JSON array, Netscape / curl format, or raw Key=Value pairs</div>
      </div>
      <div class="form-group">
        <label>Name Prefix (Optional)</label>
        <input type="text" id="nameInput" placeholder="Google Account" />
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <input type="checkbox" id="probeCheck" checked />
        <label for="probeCheck" style="font-size:11px;color:var(--fg2);letter-spacing:.3px;cursor:pointer;text-transform:none">Auto-probe sub-accounts (u/0, u/1, u/2...)</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeImportModal()">Cancel</button>
      <button class="btn primary" onclick="doImport()" id="importBtn">Import</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const BASE = location.origin
const PWD = localStorage.getItem('aistudio_pwd') || ''

function headers(json = false) {
  const h = {}
  if (PWD) h['Authorization'] = 'Bearer ' + PWD
  if (json) h['Content-Type'] = 'application/json'
  return h
}

async function api(method, path, body) {
  const opts = { method, headers: headers(!!body) }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(BASE + path, opts)
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: { message: res.statusText } }))
    throw new Error(err.error?.message || err.detail || res.statusText)
  }
  return res.json()
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = 'toast show ' + type
  clearTimeout(el._t)
  el._t = setTimeout(() => el.className = 'toast', 3000)
}

// ── State ──
let accounts = []
let activeId = ''

async function refreshAll() {
  const btn = document.getElementById('refreshBtn')
  btn.disabled = true
  try {
    const [accs, active] = await Promise.all([
      api('GET', '/accounts'),
      api('GET', '/accounts/active').catch(() => null)
    ])
    accounts = accs || []
    activeId = active?.id || ''
    render()
  } catch (e) {
    toast(e.message, 'error')
  } finally {
    btn.disabled = false
  }
}

function render() {
  const container = document.getElementById('listContainer')
  document.getElementById('statTotal').textContent = accounts.length
  const groups = new Set(accounts.map(a => a.cookie_id || a.id))
  document.getElementById('statGroups').textContent = groups.size
  const activeAcc = accounts.find(a => a.id === activeId)
  document.getElementById('statActive').textContent = activeAcc ? (activeAcc.name || activeAcc.id).substring(0, 16) : '—'

  if (!accounts.length) {
    container.innerHTML = '<div class="empty"><div class="icon">◇</div><p>No accounts imported</p></div>'
    return
  }

  // Group by cookie_id
  const grouped = {}
  accounts.forEach(a => {
    const gid = a.cookie_id || 'ungrouped_' + a.id
    if (!grouped[gid]) grouped[gid] = []
    grouped[gid].push(a)
  })

  let html = ''
  for (const [gid, group] of Object.entries(grouped)) {
    html += '<div class="account-list" style="margin-bottom:16px">'
    group.forEach(a => {
      const isActive = a.id === activeId
      const email = a.email || '—'
      const time = a.last_used ? new Date(a.last_used).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—'
      html += `
        <div class="account-card${isActive ? ' active' : ''}">
          <div class="account-info">
            <div class="account-name">${esc(a.name || a.id)}</div>
            <div class="account-meta">
              <span class="tag">u/${a.auth_user || '0'}</span>
              <span>${esc(email)}</span>
              <span>${time}</span>
              ${isActive ? '<span style="color:var(--success);font-weight:600">● ACTIVE</span>' : ''}
            </div>
          </div>
          <div class="account-actions">
            ${isActive ? '' : `<button class="btn sm" onclick="activate('${a.id}')">Activate</button>`}
            <button class="btn sm" onclick="detectEmail('${a.id}')">Detect</button>
            <button class="btn sm danger" onclick="del('${a.id}','${esc(a.name)}')">✕</button>
          </div>
        </div>`
    })
    if (group.length > 1) {
      html += `<div style="padding:6px 20px;background:var(--card);text-align:right">
        <button class="btn sm danger" onclick="delGroup('${gid}')">Delete entire group (${group.length})</button>
      </div>`
    }
    html += '</div>'
  }
  container.innerHTML = html
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// ── Actions ──
async function activate(id) {
  try {
    await api('POST', `/accounts/${id}/activate`)
    toast('Account activated')
    await refreshAll()
  } catch (e) { toast(e.message, 'error') }
}

async function detectEmail(id) {
  try {
    const res = await api('POST', `/accounts/${id}/detect-email`)
    toast(res.email ? `Email: ${res.email}` : 'No email detected')
    await refreshAll()
  } catch (e) { toast(e.message, 'error') }
}

async function del(id, name) {
  if (!confirm(`Delete account "${name}"?`)) return
  try {
    await api('DELETE', `/accounts/${id}`)
    toast('Deleted')
    await refreshAll()
  } catch (e) { toast(e.message, 'error') }
}

async function delGroup(cookieId) {
  if (!confirm('Delete ALL accounts in this cookie group?')) return
  try {
    const res = await api('DELETE', `/accounts/group/${cookieId}`)
    toast(`Deleted ${res.deleted} accounts`)
    await refreshAll()
  } catch (e) { toast(e.message, 'error') }
}

// ── Import ──
function openImportModal() { document.getElementById('importModal').classList.add('open') }
function closeImportModal() { document.getElementById('importModal').classList.remove('open') }

async function doImport() {
  const cookies = document.getElementById('cookieInput').value.trim()
  if (!cookies) return toast('Please paste cookie string', 'error')
  const prefix = document.getElementById('nameInput').value.trim() || 'Google Account'
  const probe = document.getElementById('probeCheck').checked
  const btn = document.getElementById('importBtn')
  btn.disabled = true
  btn.textContent = 'Importing...'
  try {
    if (probe) {
      const res = await api('POST', '/accounts/probe-import', { cookies, name_prefix: prefix })
      toast(`Imported ${res.imported_count} accounts`)
    } else {
      const res = await api('POST', '/accounts/import-cookies', { cookies, name: prefix })
      toast(`Imported ${res.cookie_count} cookies (u/${res.auth_user})`)
    }
    closeImportModal()
    document.getElementById('cookieInput').value = ''
    await refreshAll()
  } catch (e) {
    toast(e.message, 'error')
  } finally {
    btn.disabled = false
    btn.textContent = 'Import'
  }
}

// ── Auth ──
;(async function init() {
  try {
    const check = await fetch(BASE + '/auth/check').then(r => r.json())
    if (check.auth_enabled && !PWD) {
      const p = prompt('Enter admin password:')
      if (p) { localStorage.setItem('aistudio_pwd', p); location.reload(); return }
    }
  } catch(e) {}
  refreshAll()
})()

// Close modal on overlay click
document.getElementById('importModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeImportModal()
})
</script>
</body>
</html>
